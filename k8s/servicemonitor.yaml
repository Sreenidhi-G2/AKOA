apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: akoa-services
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [default]
  selector:
    matchLabels:
      monitoring: akoa
  endpoints:
    - port: http
      path: /metrics
      interval: 15s